# Free-tier Supabase projects pause after ~7 days without activity. This pings the
# REST API once a day with a harmless read so the project never goes idle.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 9 * * *' # Every day, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Supabase
        run: |
          url=$(grep -oP "SUPABASE_URL = '\K[^']+" docs/config.js)
          key=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" docs/config.js)
          curl -fsS "$url/rest/v1/results?select=team_id&limit=1" \
            -H "apikey: $key" -H "Authorization: Bearer $key"
